    <script>
      (function () {
        var mode = "auto";
        try {
          mode = localStorage.getItem("portfolio:theme-mode") || "auto";
        } catch (e) {}
        var dark = mode === "dark" || (mode === "auto" && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = dark ? "dark" : "light";
      })();

    <style>
      #preloader {
        --bg: #f4f6fa;
        --fg: #13203a;
        --accent: #1f7a4d;
        --track: #dde3ec;
        position: fixed;
        inset: 0;
        z-index: 1000;
        display: grid;
        place-items: center;
        background: var(--bg);
        color: var(--fg);
        font-family: ui-monospace, "JetBrains Mono", Consolas, monospace;
        transition: opacity 0.4s ease, visibility 0.4s;
      }
      [data-theme="dark"] #preloader {
        --bg: #0f1a2c;
        --fg: #e6ecf5;
        --accent: #4fd1a0;
        --track: #24334d;
      }
      #preloader.done {
        opacity: 0;
        visibility: hidden;
      }
      #preloader .inner {
        display: grid;
        justify-items: center;
        gap: 1rem;
      }
      #preloader .logo {
        padding: 0.2rem 0.6rem;
        border: 2px solid var(--accent);
        border-radius: 0.3rem;
        color: var(--accent);
        font-size: 1.1rem;
      }
      #preloader .logo::after {
        content: "_";
        animation: preloader-blink 0.9s steps(1) infinite;
      }
      #preloader .bar {
        position: relative;
        width: 8rem;
        height: 4px;
        overflow: hidden;
        background: var(--track);
        border-radius: 999px;
      }
      #preloader .bar::after {
        content: "";
        position: absolute;
        inset: 0 auto 0 0;
        width: 40%;
        border-radius: 999px;
        background: var(--accent);
        animation: preloader-slide 1.1s ease-in-out infinite;
      }
      @keyframes preloader-blink {
        50% { opacity: 0; }
      }
      @keyframes preloader-slide {
        from { translate: -100% 0; }
        to { translate: 250% 0; }
      }
    </style>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
